name: Test automatici CRAL Champions

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tornei.json'
      - 'admin/**'
      - 'tornei/**'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - 'playwright.live.config.js'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cral-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-unit:
    name: Integrità, sintassi e unit test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Installa dipendenze test
        run: npm install --no-audit --no-fund
      - name: Controllo sintassi JavaScript
        run: npm run check:syntax
      - name: Test integrità repository
        run: npm run test:static
      - name: Unit test logica Admin
        run: npm run test:unit
  browser:
    name: Frontend Chromium + Firefox + WebKit + iPhone
    needs: static-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Installa dipendenze test
        run: npm install --no-audit --no-fund
      - name: Installa browser Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test browser e mobile emulato
        run: npm run test:browser
      - name: Report browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browser-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
  admin-functional:
    name: Admin funzionale con GitHub API simulate
    needs: static-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Installa dipendenze test
        run: npm install --no-audit --no-fund
      - name: Installa Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Import, Promote e Rollback con mock GitHub stateful
        run: npm run test:functional
      - name: Report Admin funzionale
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-admin-functional-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
  quality-gate:
    name: QUALITY GATE
    if: always()
    needs: [static-unit, browser, admin-functional]
    runs-on: ubuntu-latest
    steps:
      - name: Verifica esito complessivo
        env:
          STATIC_UNIT: ${{ needs.static-unit.result }}
          BROWSER: ${{ needs.browser.result }}
          ADMIN_FUNCTIONAL: ${{ needs.admin-functional.result }}
        run: |
          echo "static-unit=$STATIC_UNIT"
          echo "browser=$BROWSER"
          echo "admin-functional=$ADMIN_FUNCTIONAL"
          test "$STATIC_UNIT" = success
          test "$BROWSER" = success
          test "$ADMIN_FUNCTIONAL" = success
          echo "✅ QUALITY GATE superato"
