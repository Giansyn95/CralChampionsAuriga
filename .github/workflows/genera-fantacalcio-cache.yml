name: Genera cache Fantacalcio

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'tornei.json'
      - 'tornei/**/index.html'
      - 'tornei/**/data/**/*.csv'
      - 'tools/genera_fantacalcio_cache.js'
      - '.github/workflows/genera-fantacalcio-cache.yml'
  workflow_dispatch:
    inputs:
      torneo_dir:
        description: 'Cartella torneo da elaborare, es. tornei/2026-spring. Usa current per il torneo corrente, oppure all per tutti.'
        required: false
        default: 'current'

concurrency:
  group: cral-generated-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Determina tornei da aggiornare
        id: tornei
        shell: bash
        run: |
          current_dir="$(node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('tornei.json', 'utf8'));
          const tornei = Array.isArray(cfg.tornei) ? cfg.tornei : [];
          const torneo =
            tornei.find(t => t.corrente === true && t.attivo !== false) ||
            tornei.find(t => t.stato === 'in-corso' && t.attivo !== false) ||
            tornei.find(t => t.attivo === true);
          if (!torneo || !torneo.cartella) {
            console.error('Nessun torneo corrente/attivo con cartella trovato in tornei.json');
            process.exit(1);
          }
          process.stdout.write(torneo.cartella);
          NODE
          )"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            input="${{ inputs.torneo_dir }}"
            if [ -z "$input" ] || [ "$input" = "current" ]; then
              dirs="$current_dir"
            else
              dirs="$input"
            fi
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
            echo "Tornei richiesti: $dirs"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          git diff --name-only "$before" "$after" > changed_files.txt 2>/dev/null || git diff --name-only HEAD~1 HEAD > changed_files.txt

          if grep -qx 'tornei.json' changed_files.txt; then
            dirs="$current_dir"
          else
            dirs=$(awk -F/ '/^tornei\/[^/]+\// {print $1"/"$2}' changed_files.txt | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')
            if [ -z "$dirs" ]; then
              dirs="$current_dir"
            fi
          fi

          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Tornei rilevati: $dirs"

      - name: Preflight Fantacalcio
        id: fanta
        shell: bash
        run: |
          requested="${{ steps.tornei.outputs.dirs }}"
          report="$RUNNER_TEMP/fantacalcio-preflight.json"

          if [ "$requested" = "all" ]; then
            node tools/genera_fantacalcio_cache.js --preflight-only --all --report-file "$report"
          else
            node tools/genera_fantacalcio_cache.js --preflight-only --report-file "$report" $requested
          fi

          node - "$report" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('fs');
          const [reportFile, outputFile] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportFile, 'utf8'));
          const ready = Array.isArray(report.ready) ? report.ready : [];
          const dirs = ready.map(x => x.dir).filter(Boolean);
          fs.appendFileSync(outputFile, `has_work=${dirs.length ? 'true' : 'false'}\n`);
          fs.appendFileSync(outputFile, `dirs=${dirs.join(' ')}\n`);
          console.log(dirs.length ? `Tornei da elaborare: ${dirs.join(', ')}` : 'Nessun torneo con Fantacalcio configurato.');
          NODE

      - name: Installa Playwright Chromium
        if: steps.fanta.outputs.has_work == 'true'
        run: |
          npm install --no-save playwright-chromium
          npx playwright install --with-deps chromium

      - name: Genera cache Fantacalcio
        if: steps.fanta.outputs.has_work == 'true'
        shell: bash
        run: |
          dirs="${{ steps.fanta.outputs.dirs }}"
          node tools/genera_fantacalcio_cache.js $dirs

      - name: Certifica cache generata
        if: steps.fanta.outputs.has_work == 'true'
        shell: bash
        run: |
          dirs="${{ steps.fanta.outputs.dirs }}"
          node tools/genera_fantacalcio_cache.js --validate-only $dirs

      - name: Commit cache aggiornata
        if: steps.fanta.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail

          dirs="${{ steps.fanta.outputs.dirs }}"
          branch="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          regenerate_and_certify() {
            echo "Rigenerazione cache sull'ultimo commit disponibile: $(git rev-parse --short HEAD)"
            node tools/genera_fantacalcio_cache.js $dirs
            node tools/genera_fantacalcio_cache.js --validate-only $dirs
          }

          stage_and_commit() {
            local cache_files=()
            local dir cache

            for dir in $dirs; do
              cache="$dir/data/fantacalcio/fantacalcio_cache.json"
              if [ ! -f "$cache" ]; then
                echo "::error title=Cache Fantacalcio mancante::Attesa cache non trovata: $cache"
                return 2
              fi
              cache_files+=("$cache")
            done

            git add "${cache_files[@]}"

            if git diff --cached --quiet; then
              echo "Cache Fantacalcio gia aggiornata e certificata sull'ultimo main."
              return 1
            fi

            git commit -m "Aggiorna cache Fantacalcio"
            return 0
          }

          # La cache e un artefatto derivato: non tentiamo mai merge/rebase del JSON.
          # Se main e avanzato durante build/certificazione, ripartiamo dall'ultimo main
          # e rigeneriamo la cache dalle sorgenti correnti.
          git fetch origin "$branch"
          remote_head="$(git rev-parse "origin/$branch")"
          local_head="$(git rev-parse HEAD)"

          if [ "$local_head" != "$remote_head" ]; then
            echo "::notice title=Main avanzato::Il branch e cambiato durante la generazione. Rigenero la cache sull'ultimo commit remoto."
            git reset --hard "origin/$branch"
            regenerate_and_certify
          fi

          if stage_and_commit; then
            :
          else
            rc=$?
            if [ "$rc" -eq 1 ]; then
              echo "### Commit cache Fantacalcio" >> "$GITHUB_STEP_SUMMARY"
              echo "- ✅ Nessuna modifica da pubblicare: cache gia allineata all'ultimo \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$rc"
          fi

          if git push origin "HEAD:$branch"; then
            echo "### Commit cache Fantacalcio" >> "$GITHUB_STEP_SUMMARY"
            echo "- ✅ Cache certificata e pubblicata su \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Un altro commit puo arrivare tra fetch e push. Un solo retry sicuro:
          # scartiamo la cache generata sul vecchio HEAD, prendiamo l'ultimo main,
          # rigeneriamo e ricertifichiamo. Nessun force-push e nessun merge del JSON.
          echo "::warning title=Branch aggiornato durante il push::Push non accettato. Eseguo un unico retry rigenerando la cache sull'ultimo $branch."
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          regenerate_and_certify

          if stage_and_commit; then
            :
          else
            rc=$?
            if [ "$rc" -eq 1 ]; then
              echo "### Commit cache Fantacalcio" >> "$GITHUB_STEP_SUMMARY"
              echo "- ✅ Retry completato: la cache remota era gia aggiornata." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$rc"
          fi

          git push origin "HEAD:$branch"
          echo "### Commit cache Fantacalcio" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Cache rigenerata sull'ultimo \`$branch\`, ricertificata e pubblicata al secondo tentativo." >> "$GITHUB_STEP_SUMMARY"
