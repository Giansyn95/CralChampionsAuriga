name: Rinomina cartella torneo

on:
  workflow_dispatch:
    inputs:
      old_path:
        description: "Cartella attuale"
        required: true
        default: "tornei/2026-estate"
      new_path:
        description: "Nuovo nome cartella"
        required: true
        default: "tornei/2026-spring"

permissions:
  contents: write

jobs:
  rename-folder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rinomina cartella
        run: |
          OLD_PATH="${{ github.event.inputs.old_path }}"
          NEW_PATH="${{ github.event.inputs.new_path }}"

          if [ ! -d "$OLD_PATH" ]; then
            echo "Errore: la cartella $OLD_PATH non esiste"
            exit 1
          fi

          if [ -e "$NEW_PATH" ]; then
            echo "Errore: $NEW_PATH esiste già"
            exit 1
          fi

          mkdir -p "$(dirname "$NEW_PATH")"
          git mv "$OLD_PATH" "$NEW_PATH"

      - name: Aggiorna riferimenti nei file non-workflow
        run: |
          OLD_PATH="${{ github.event.inputs.old_path }}"
          NEW_PATH="${{ github.event.inputs.new_path }}"
          OLD_FOLDER="$(basename "$OLD_PATH")"
          NEW_FOLDER="$(basename "$NEW_PATH")"

          grep -rl "$OLD_PATH\|$OLD_FOLDER" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.github \
            || true

          grep -rl "$OLD_PATH\|$OLD_FOLDER" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.github \
            | xargs -r sed -i "s|$OLD_PATH|$NEW_PATH|g; s|$OLD_FOLDER|$NEW_FOLDER|g"

      - name: Commit e push
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi

          git status
          git add .
          git commit -m "Rinomina torneo da 2026-estate a 2026-spring"
          git push
