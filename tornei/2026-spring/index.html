<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Favicon: icona nella scheda del browser e nei preferiti/segnalibri.
       Usa lo stesso logo del CRAL già presente in immagini/. Se il file
       ha un nome diverso da logo_cral.png, basta cambiare questo percorso.
       Su iOS (preferiti Safari, home screen) serve specificamente
       apple-touch-icon in un formato quadrato pieno (no trasparenza,
       idealmente 180x180px), altrimenti iOS mostra l'iniziale del titolo. -->
  <link rel="icon" type="image/png" href="immagini/logo_cral.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="immagini/logo_cral.png" />
  <link rel="apple-touch-icon" href="immagini/logo_cral.png" />
  <!-- Il logo CRAL resta lo stesso tra un'edizione e l'altra del torneo: lo
       precarichiamo con priorità alta così il browser inizia a scaricarlo
       nell'istante in cui legge l'head, prima ancora che parta lo script.
       Lavora insieme al Service Worker (sw.js) che lo mette in cache
       permanente: dal secondo caricamento in poi non viene più richiesto
       in rete, quindi appare istantaneo anche offline. -->
  <link rel="preload" as="image" href="immagini/logo_cral.png" fetchpriority="high" />
  <title>CRAL Champions</title>
  <!-- Open Graph: anteprima link su WhatsApp, Telegram, Facebook ecc.
       Letti dai crawler senza eseguire JavaScript, quindi i valori restano fissi
       (non vengono presi dal config.csv, che è dinamico). L'URL punta al repository
       GitHub Pages corrente e va aggiornato solo se cambia il nome del repository. -->
  <meta property="og:title" content="CRAL Champions" />
  <meta property="og:description" content="Classifiche, calendario, risultati e statistiche giocatori del torneo aziendale CRAL Champions" />
  <meta property="og:image" content="https://cralauriga.github.io/CralChampionsAuriga/immagini/logo_cral.png" />
  <meta property="og:url" content="https://cralauriga.github.io/CralChampionsAuriga/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Preconnect: risparmia DNS/TLS quando Chart.js viene richiesto al volo nella Home -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <!-- Font: Oswald per titoli/hero/tab (stile scoreboard sportivo), Inter per corpo testo e tabelle (leggibilità e cifre tabellari allineate) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Preload: il browser inizia a scaricare il file più critico (manifest) subito,
       in parallelo col parsing dell'HTML, invece di aspettare che lo script in fondo
       alla pagina venga eseguito ed esegua la fetch() -->
  <link rel="preload" href="data/manifest.csv" as="fetch">

<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <div class="hero-logo" id="heroLogoWrap">
        <!-- Logo SVG di fallback (stemma CRAL generico): resta sempre nel DOM,
             sotto l'immagine vera, e si vede solo se quest'ultima manca
             (rimossa dall'onerror qui sotto). -->
        <svg id="heroLogoFallback" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo CRAL">
          <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,.15)" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
          <path d="M32 10 L38 24 H54 L42 33 L46 47 L32 38 L18 47 L22 33 L10 24 H26 Z" fill="#f5b942" opacity=".9"/>
          <text x="32" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="900" fill="rgba(255,255,255,.8)">CRAL</text>
        </svg>
        <!-- Logo vero, caricato subito dall'HTML: non aspetta nessuno script.
             Sovrapposto (position:absolute, vedi CSS .hero-logo img) esattamente
             sopra allo SVG, così anche nel primissimo istante di rendering non si
             vedono mai "due loghi" affiancati, qualunque sia il timing di rete.
             Insieme al Service Worker (sw.js), che lo tiene precaricato in cache
             fin dall'installazione con auto-aggiornamento in background, dal
             secondo accesso in poi appare istantaneo, senza alcun flash, anche
             su refresh molto rapidi. onload/onerror sono inline e autosufficienti
             (non toccano variabili dello script principale più sotto) proprio per
             poter reagire subito, prima ancora che il resto della pagina sia pronto. -->
        <img id="heroLogoImg" alt="Logo CRAL" decoding="async" fetchpriority="high"
             src="immagini/logo_cral.png"
             onload="window.__cralLogoStatic=true;"
             onerror="window.__cralLogoStatic=false;this.remove();">
      </div>
      <div>
        <h1 id="siteTitle">CRAL Champions</h1>
        <p id="siteSubtitle">Sito statico torneo</p>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn icon-btn" id="btnRefresh" title="Ricarica dati aggiornati" aria-label="Ricarica dati aggiornati" onclick="loadAuto(true)">🔄</button>
      <button class="btn icon-btn" id="btnTheme" title="Cambia tema" aria-label="Cambia tema chiaro/scuro">🌙</button>
      <span class="status" id="status">Avvio...</span>
    </div>
  </div>

  <!-- Banner errori di caricamento dettagliato -->
  <div id="errorBanner" role="alert" aria-live="polite" style="display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:14px;padding:14px 18px;margin-bottom:14px;color:var(--red);font-weight:600">
    <div>⚠️ Trovati <span id="errCount">0</span> problema/i durante il caricamento dei CSV</div>
    <div id="errGroups"></div>
  </div>

  <input class="search" id="search" placeholder="Cerca squadra, giocatore, partita…" aria-label="Ricerca globale" />
  <div class="tabs" id="tabs" role="tablist"></div>

  <section id="home"        class="section active" role="tabpanel"></section>
  <section id="classifiche" class="section"        role="tabpanel"></section>
  <section id="statistiche" class="section"        role="tabpanel"></section>
  <section id="squadre"     class="section"        role="tabpanel"></section>
  <section id="calendario"  class="section"        role="tabpanel"></section>
  <section id="risultati"   class="section"        role="tabpanel"></section>
  <section id="riepilogo"   class="section"        role="tabpanel"></section>
  <section id="pagellone"   class="section"        role="tabpanel"></section>
  <section id="fantacalcio" class="section"        role="tabpanel"></section>
</div>
